name: Verify Canvas Managed RED
on:
  push:
    branches: [fix/browser-canvas-managed]
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_web_shell.WebShellTests.test_patch_prevents_pygbag_from_overriding_canvas_size -v
