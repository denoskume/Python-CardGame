name: Verify Adaptive Difficulty
on:
  push:
    branches: [feature/adaptive-shuffle-max-bet]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run adaptive difficulty tests
        run: python -m unittest tests.test_adaptive_difficulty -v
