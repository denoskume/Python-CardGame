name: Verify Bet Avatar Return
on:
  push:
    branches: [fix/bet-avatar-return]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression test
        run: python -m unittest tests.test_bet_avatar_return -v
