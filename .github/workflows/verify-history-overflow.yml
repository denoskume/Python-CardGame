name: Verify History Overflow
on:
  push:
    branches: [feature/history-table-overflow-fix]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run overflow regression test
        run: python -m unittest tests.test_history_layout -v
