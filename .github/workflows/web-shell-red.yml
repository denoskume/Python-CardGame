name: Verify Full Viewport Web Shell

on:
  push:
    branches: [fix/full-viewport-web-shell]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile src/main.py src/game.py src/dashboard.py src/desktop_menu.py src/user.py src/bet.py scripts/patch_web_shell.py
      - name: Build browser bundle
        run: bash scripts/build_web.sh
      - name: Verify generated shell
        run: |
          grep -q 'full-viewport-shell' src/build/web/index.html
          grep -q 'window.innerWidth' src/build/web/index.html
          grep -q 'window.innerHeight' src/build/web/index.html
          ! grep -q 'fb_width : "1280"' src/build/web/index.html
          ! grep -q 'fb_height : "720"' src/build/web/index.html
