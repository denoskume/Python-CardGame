name: Verify Web Shell RED

on:
  push:
    branches: [fix/full-viewport-web-shell]

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run web shell regression test
        run: python -m unittest tests.test_web_shell -v
