name: Verify Inline Input
on:
  push:
    branches: [fix/inline-name-input]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run inline input test
        run: python -m unittest tests.test_inline_menu_input -v
