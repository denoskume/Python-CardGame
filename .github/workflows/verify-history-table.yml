name: Verify History Table
on:
  push:
    branches: [feature/history-table-style]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run history table tests
        run: python -m unittest tests.test_history_table -v
