name: Verify Native Inline Input
on:
  push:
    branches: [fix/native-inline-name-input]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run targeted test
        run: python -m unittest tests.test_menu_input_native_typing -v
