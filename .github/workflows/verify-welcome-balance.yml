name: Verify Welcome Balance
on:
  push:
    branches: [fix/one-time-welcome-balance]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run welcome profile tests
        run: python -m unittest tests.test_player_profiles -v
