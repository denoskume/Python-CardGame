name: Verify Aggregated History
on:
  push:
    branches: [feature/aggregate-history-users]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile src/main.py src/game.py src/dashboard.py src/history_table.py src/dynamic_difficulty.py src/bet.py src/user.py src/bet_avatar_return.py src/desktop_menu.py src/menu_input.py src/player_profiles.py src/web_history.py src/welcome_balance_ui.py
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build browser bundle
        run: bash scripts/build_web.sh
