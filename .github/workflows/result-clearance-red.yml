name: Verify Result Clearance
on:
  push:
    branches: [fix/result-card-button-clearance]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile src/main.py src/game.py src/dashboard.py src/desktop_menu.py src/user.py src/bet.py
