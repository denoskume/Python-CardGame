name: Verify Direct Name Input
on:
  push:
    branches: [fix/direct-name-input]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run direct input regression test
        run: python -m unittest tests.test_direct_name_input -v
