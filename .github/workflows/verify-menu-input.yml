name: Verify Menu Input
on:
  push:
    branches: [fix/direct-menu-text-input]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression test
        run: python -m unittest tests.test_menu_input_visibility -v
